# GitHub'da şu yola koy:  .github/workflows/update-cs-inventory.yml
name: Update CS inventory

on:
  schedule:
    - cron: '0 */12 * * *'   # 12 saatte bir
  workflow_dispatch:          # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Envanteri çek
        run: node update-cs-inventory.mjs
      - name: Değiştiyse kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cs-inventory.json
          git diff --cached --quiet || (git commit -m "update cs inventory" && git push)
